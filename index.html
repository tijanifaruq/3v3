<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1822">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kickoff 3v3</title>
<style>
:root{
  --night:#0a1822; --night2:#10283a; --pitch:#1d8140; --chalk:#f3f6ef; --t0:#2fd3e6; --t1:#ff5a3c; --gold:#ffd23f;
  --u:min(15vmin,92px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--chalk);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;transform-origin:0 0}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button,input,select{font:inherit;color:inherit}
button{border:0;cursor:pointer;touch-action:manipulation}

/* ---------- screens (menu / lobby) ---------- */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  touch-action:pan-y;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  background:linear-gradient(90deg,rgba(10,24,34,.92) 0%,rgba(10,24,34,.72) 55%,rgba(10,24,34,.35) 100%);overflow:auto}
.panel{width:min(980px,100%);display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(14px,3vw,38px);align-items:center}
h1{margin:0;font-weight:900;font-style:italic;font-size:clamp(40px,11vmin,92px);line-height:.88;letter-spacing:-.045em}
h1 span{display:block}
h1 .a{color:var(--t0)} h1 .b{color:var(--t1)}
.tag{margin:12px 0 0;font-size:clamp(13px,2.4vmin,17px);opacity:.78;max-width:30ch;line-height:1.35}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{padding:clamp(9px,2.3vmin,14px) 18px;border-radius:12px;font-weight:800;font-size:clamp(15px,2.8vmin,19px);background:#1b3a52;color:var(--chalk);text-align:left;
  display:flex;justify-content:space-between;align-items:center;gap:10px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97);background:#25506f}
.btn small{font-weight:500;opacity:.7;font-size:.72em}
.btn.go{background:var(--gold);color:#241b00}
.btn.go:active{background:#ffe27a}
.btn.ghost{background:transparent;outline:2px solid #2d4d66}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;padding:13px 14px;border-radius:12px;border:2px solid #2d4d66;background:#0d1f2d;font-weight:700;font-size:clamp(15px,2.8vmin,19px);outline:none}
.field input:focus{border-color:var(--gold)}
#codeIn{text-transform:uppercase;letter-spacing:.3em;text-align:center}
#menuMsg,#lobMsg{min-height:1.3em;font-size:14px;color:#ffb3a8}
details{font-size:14px;opacity:.9}
details summary{cursor:pointer;padding:6px 0;opacity:.75}
details .row{display:flex;gap:8px;align-items:center;margin:6px 0}
details input,details select{padding:8px;border-radius:8px;border:1px solid #2d4d66;background:#0d1f2d;flex:1;min-width:0}

/* lobby */
.lob{display:flex;flex-direction:column;gap:12px;width:min(760px,100%)}
.code{font-weight:900;font-size:clamp(34px,9vmin,64px);letter-spacing:.18em;font-style:italic}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{border-radius:14px;padding:12px;background:rgba(16,40,58,.85)}
.team h3{margin:0 0 8px;font-size:18px;font-weight:900;font-style:italic}
.team.t0 h3{color:var(--t0)} .team.t1 h3{color:var(--t1)}
.slot{padding:9px 10px;border-radius:9px;background:rgba(0,0,0,.25);margin-bottom:6px;font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.slot.open{opacity:.5;font-weight:500}
.slot.me{outline:2px solid var(--gold)}
.lobbtns{display:flex;gap:8px;flex-wrap:wrap}
.lobbtns .btn{flex:1;min-width:130px;justify-content:center;text-align:center}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#score{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;
  border-radius:12px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.45);font-weight:900;font-style:italic}
#score div{padding:5px 14px;font-size:clamp(20px,5.2vmin,34px);line-height:1.1;min-width:2.1em;text-align:center}
#sA{background:var(--t0);color:#06232a} #sB{background:var(--t1);color:#fff}
#clock{background:#0a1822;font-size:clamp(15px,3.6vmin,22px)!important;font-style:normal;font-variant-numeric:tabular-nums;display:flex;align-items:center;min-width:3.4em!important;justify-content:center}
#net{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));font-size:11px;opacity:.7;text-align:right;line-height:1.3;font-variant-numeric:tabular-nums}
#menuBtn{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));pointer-events:auto;width:44px;height:44px;border-radius:12px;background:rgba(10,24,34,.7);font-size:20px;font-weight:900}
#center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
#center .big{font-weight:900;font-style:italic;font-size:clamp(54px,18vmin,150px);line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#center .sub{font-weight:700;font-size:clamp(14px,3.4vmin,24px);margin-top:6px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
#center.pop .big{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#center.pop .big{animation:none}}
#toast{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);background:rgba(10,24,34,.85);padding:8px 14px;border-radius:10px;font-size:14px;font-weight:700}

/* controls */
#joyZone{position:absolute;left:0;top:18%;bottom:0;width:52%;pointer-events:auto;touch-action:none}
#joyBase{position:absolute;width:calc(var(--u)*1.7);height:calc(var(--u)*1.7);margin:calc(var(--u)*-.85) 0 0 calc(var(--u)*-.85);border-radius:50%;
  border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);display:none}
#joyKnob{position:absolute;left:50%;top:50%;width:calc(var(--u)*.78);height:calc(var(--u)*.78);margin:calc(var(--u)*-.39) 0 0 calc(var(--u)*-.39);border-radius:50%;background:rgba(255,255,255,.55)}
.cb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:clamp(11px,2.5vmin,15px);background:rgba(10,24,34,.55);border:3px solid rgba(255,255,255,.55);color:var(--chalk);
  transition:transform .05s,background .1s;overflow:hidden}
.cb.on{transform:scale(.92);background:rgba(255,255,255,.4)}
#bShoot{width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));border-color:var(--gold);color:var(--gold);font-size:clamp(13px,3vmin,18px)}
#bShoot i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--chg,0)*100%);background:rgba(255,210,63,.55)}
#bPass{width:calc(var(--u)*.95);height:calc(var(--u)*.95);right:calc(26px + var(--u)*1.2 + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom))}
#bSprint{width:calc(var(--u)*.95);height:calc(var(--u)*.95);right:calc(26px + env(safe-area-inset-right));bottom:calc(28px + var(--u)*1.2 + env(safe-area-inset-bottom))}
#bSprint i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--st,1)*100%);background:rgba(120,220,255,.35)}
#bTackle{width:calc(var(--u)*.9);height:calc(var(--u)*.9);right:calc(38px + var(--u)*1.2 + env(safe-area-inset-right));bottom:calc(32px + var(--u)*1.2 + env(safe-area-inset-bottom))}
.cb b{position:relative}

/* overlays */
.ov{position:absolute;inset:0;background:rgba(5,12,18,.78);display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(440px,100%);background:var(--night2);border-radius:18px;padding:22px;text-align:center}
.card h2{margin:0 0 4px;font-size:clamp(30px,8vmin,50px);font-weight:900;font-style:italic;line-height:1}
.card .res{font-weight:800;margin:6px 0 14px;font-size:18px}
.fscore{font-weight:900;font-size:clamp(40px,11vmin,72px);font-style:italic;margin:6px 0}
.fscore .r{color:var(--t0)} .fscore .b{color:var(--t1)}
</style>
</head>
<body>
<div id="stage">
<canvas id="gl"></canvas>

<!-- MENU -->
<section id="menu" class="screen">
  <div class="panel">
    <div>
      <h1><span class="a">Kickoff</span><span class="b">3v3</span></h1>
      <p class="tag">Five-minute pitch, three minutes on the clock. Up to six real players, one footballer each.</p>
    </div>
    <div class="stack">
      <div class="field"><input id="nameIn" maxlength="12" placeholder="Your name" autocomplete="off"></div>
      <button class="btn go" id="btnQuick">Quick match <small>online</small></button>
      <button class="btn" id="btnCreate">Create room <small>invite friends</small></button>
      <div class="field"><input id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters"><button class="btn" id="btnJoin" style="padding:13px 22px">Join</button></div>
      <button class="btn ghost" id="btnSolo">Play solo <small>offline, vs CPU</small></button>
      <div id="menuMsg"></div>
      <details><summary>Settings</summary>
        <div class="row"><label for="qual">Graphics</label>
          <select id="qual"><option value="auto">Auto</option><option value="low">Battery saver</option><option value="high">Sharp</option></select></div>
        <div class="row"><label for="snd">Sound</label><select id="snd"><option value="1">On</option><option value="0">Off</option></select></div>
        <div class="row"><label for="srvIn">Server</label><input id="srvIn" placeholder="auto (this site)" autocomplete="off"></div>
      </details>
    </div>
  </div>
</section>

<!-- LOBBY -->
<section id="lobby" class="screen hidden">
  <div class="lob">
    <div><div style="opacity:.7;font-size:14px">Room code</div><div class="code" id="lobCode">----</div></div>
    <div class="teams">
      <div class="team t0"><h3>Sky</h3><div id="team0"></div></div>
      <div class="team t1"><h3>Fire</h3><div id="team1"></div></div>
    </div>
    <div id="lobMsg" style="color:var(--chalk);opacity:.85"></div>
    <div class="lobbtns">
      <button class="btn go" id="btnStart">Start match</button>
      <button class="btn" id="btnSwitch">Switch team</button>
      <button class="btn" id="btnShare">Share code</button>
      <button class="btn ghost" id="btnLeave">Leave</button>
    </div>
  </div>
</section>

<!-- HUD -->
<section id="hud" class="hidden">
  <button id="menuBtn" aria-label="Menu">II</button>
  <div id="score"><div id="sA">0</div><div id="clock">3:00</div><div id="sB">0</div></div>
  <div id="net"></div>
  <div id="center"><div class="big" id="cBig"></div><div class="sub" id="cSub"></div></div>
  <div id="toast" class="hidden"></div>
  <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div class="cb" id="bShoot"><i></i><b>Shoot</b></div>
  <div class="cb" id="bPass"><b>Pass</b></div>
  <div class="cb" id="bSprint"><i></i><b>Sprint</b></div>
  <div class="cb" id="bTackle"><b>Tackle</b></div>
</section>

<!-- pause / full time -->
<div id="pause" class="ov hidden"><div class="card">
  <h2>Paused</h2><div class="res" id="pauseSub"></div>
  <div class="stack"><button class="btn go" id="btnResume">Resume</button><button class="btn ghost" id="btnQuit">Leave match</button></div>
</div></div>
<div id="full" class="ov hidden"><div class="card">
  <h2>Full time</h2>
  <div class="fscore"><span class="r" id="fA">0</span> - <span class="b" id="fB">0</span></div>
  <div class="res" id="fRes"></div>
  <div class="stack" id="fBtns"></div>
</div></div>

</div><!-- /stage -->

<script>
/* three.js from CDN; falls back to /vendor/three.min.js if you copy it next to the server */
(function(){
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  s.onerror=function(){var f=document.createElement('script');f.src='vendor/three.min.js';f.onload=boot;f.onerror=function(){document.getElementById('menuMsg').textContent='Could not load the 3D engine (three.js). Check your connection.'};document.head.appendChild(f)};
  s.onload=boot; document.head.appendChild(s);
  var g=document.createElement('script'); g.src='game.js'; g.onload=boot; document.head.appendChild(g);
  var n=0; function boot(){ if(++n===2) window.__start(); }
})();
</script>

<script>
window.__start = function () {
'use strict';
const FG = FootballGame, C = FG.C, PH = FG.PH;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const lerpAng = (a, b, t) => a + FG.angDiff(a, b) * t;

const TEAM = [
  { name: 'Sky',  css: '#2fd3e6', jersey: 0x2fd3e6, front: '#2fd3e6', stripe: '#ffffff', back: '#ffffff', sleeve: 0x2fd3e6, shorts: 0x25bfd6, sock: 0x8e3cf0, boot: 0x8fe03b, sole: 0xf2c230, num: '#3a1d2b' },
  { name: 'Fire', css: '#ff5a3c', jersey: 0xff5a3c, front: '#ff5a3c', stripe: null,      back: '#ff5a3c', sleeve: 0xffffff, shorts: 0x16264a, sock: 0xffffff, boot: 0xffc21a, sole: 0x222222, num: '#ffffff' }
];
const HAIR = [0x9a5b2e, 0x2b2118, 0xc9a24b, 0x5a3a22, 0x1a1a1a, 0x7a4a26];
const NUMS = [5, 8, 10];
const SKINS = [0xf1c27d, 0xc68642, 0x8d5524, 0xe0ac69, 0x6f4a2d, 0xffdbac];

/* ------------------------------ persistent state ------------------------------ */
const store = {
  get(k, d) { try { const v = localStorage.getItem('k3_' + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('k3_' + k, v); } catch (e) { } }
};
const S = {
  screen: 'menu', mode: null, me: 1, myTeam: 0, id: 0, room: null, paused: false, leaving: false,
  names: ['CPU', 'CPU', 'CPU', 'CPU', 'CPU', 'CPU'],
  name: store.get('name', ''), token: store.get('token', ''), quality: store.get('quality', 'auto'), sound: store.get('sound', '1') === '1'
};
if (!S.token) { S.token = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('token', S.token); }
$('nameIn').value = S.name; $('qual').value = S.quality; $('snd').value = S.sound ? '1' : '0'; $('srvIn').value = store.get('srv', '');
const qs = new URLSearchParams(location.search);
if (qs.get('server')) { store.set('srv', qs.get('server')); $('srvIn').value = qs.get('server'); }
if (qs.get('room')) $('codeIn').value = qs.get('room').toUpperCase().slice(0, 4);

/* ================================ 3D WORLD ================================ */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe3f1);
scene.fog = new THREE.Fog(0xdfe3f1, 50, 120);
const camera = new THREE.PerspectiveCamera(55, 1, 0.5, 140);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8c4a6, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(8, 22, 10); scene.add(sun);

let maxPR = 1.5, pixelRatio = 1.5, camScale = 1;
function qualityPR() {
  const d = window.devicePixelRatio || 1;
  maxPR = S.quality === 'low' ? Math.min(d, 0.8) : S.quality === 'high' ? Math.min(d, 2) : Math.min(d, 1.5);
  if (S.quality !== 'auto' || pixelRatio > maxPR) pixelRatio = maxPR;
}
const stage = $('stage');
let SW = innerWidth, SH = innerHeight, rotated = false;
function layout() {                       // always present a landscape stage; if the phone is held upright, turn the game sideways
  rotated = innerHeight > innerWidth;
  SW = rotated ? innerHeight : innerWidth; SH = rotated ? innerWidth : innerHeight;
  stage.style.width = SW + 'px'; stage.style.height = SH + 'px';
  stage.style.left = rotated ? innerWidth + 'px' : '0px';
  stage.style.transform = rotated ? 'rotate(90deg)' : 'none';
}
const sp = e => rotated ? { x: e.clientY, y: innerWidth - e.clientX } : { x: e.clientX, y: e.clientY };   // screen -> stage coords
function resize() {
  layout();
  const w = SW, h = SH;
  renderer.setPixelRatio(pixelRatio); renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = camera.aspect >= 1.3 ? 52 : camera.aspect >= 1 ? 58 : 72;
  camScale = camera.aspect >= 1.3 ? 1 : camera.aspect >= 1 ? 1.12 : 1.3;
  camera.updateProjectionMatrix();
}
qualityPR(); resize();
addEventListener('resize', resize); addEventListener('orientationchange', () => setTimeout(resize, 200));

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const mat = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));

function buildStadium() {
  // pitch
  const pitchTex = canvasTex(1024, 614, (x, W, H) => {
    const sx = W / 30, sz = H / 18, X = m => (m + 15) * sx, Z = m => (m + 9) * sz;
    for (let i = 0; i < 10; i++) { x.fillStyle = i % 2 ? '#3fb05f' : '#37a456'; x.fillRect(i * W / 10, 0, W / 10 + 1, H); }
    x.strokeStyle = 'rgba(255,255,255,.9)'; x.lineWidth = 5; x.fillStyle = 'rgba(255,255,255,.9)';
    x.strokeRect(X(-14.85), Z(-8.85), 29.7 * sx, 17.7 * sz);
    x.beginPath(); x.moveTo(X(0), Z(-8.85)); x.lineTo(X(0), Z(8.85)); x.stroke();
    x.beginPath(); x.arc(X(0), Z(0), 2.4 * sx, 0, 7); x.stroke();
    x.beginPath(); x.arc(X(0), Z(0), 0.15 * sx, 0, 7); x.fill();
    for (const s of [-1, 1]) {
      x.strokeRect(s < 0 ? X(-15) : X(10.5), Z(-4.8), 4.5 * sx, 9.6 * sz);
      x.strokeRect(s < 0 ? X(-15) : X(13), Z(-3.3), 2 * sx, 6.6 * sz);
      x.beginPath(); x.arc(X(s * 11.2), Z(0), 0.13 * sx, 0, 7); x.fill();
    }
  });
  const pitch = new THREE.Mesh(new THREE.PlaneGeometry(30, 18), new THREE.MeshBasicMaterial({ map: pitchTex }));
  pitch.rotation.x = -Math.PI / 2; scene.add(pitch);
  const apron = new THREE.Mesh(new THREE.PlaneGeometry(90, 60), mat(0x5fae6d));
  apron.rotation.x = -Math.PI / 2; apron.position.y = -0.03; scene.add(apron);

  // advertising boards
  const adTex = canvasTex(256, 32, (x, W, H) => {
    const cols = ['#ffd23f', '#f3f6ef', '#ef3b3b', '#2f7bff'];
    for (let i = 0; i < 8; i++) { x.fillStyle = '#5b6b8c'; x.fillRect(i * 32, 0, 32, H); x.fillStyle = cols[i % 4]; x.fillRect(i * 32 + 4, 8, 24, 16); }
  }, [6, 1]);
  const adMat = new THREE.MeshLambertMaterial({ map: adTex });
  const box = (w, h, d, m, x, y, z) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); scene.add(o); return o; };
  for (const s of [-1, 1]) {
    box(30.6, 0.9, 0.3, adMat, 0, 0.45, s * 9.15);
    for (const e of [-1, 1]) box(0.3, 0.9, 6.4, adMat, e * 15.15, 0.45, s * 5.8);
  }
  // goals
  const white = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const netTex = canvasTex(32, 32, (x, W, H) => { x.strokeStyle = 'rgba(255,255,255,.85)'; x.lineWidth = 2; x.strokeRect(0, 0, W, H); }, [8, 3]);
  const netMat = new THREE.MeshBasicMaterial({ map: netTex, transparent: true, opacity: .55, side: THREE.DoubleSide, depthWrite: false });
  for (const s of [-1, 1]) {
    const post = (z) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, C.GOAL_H, 6), white); m.position.set(s * C.HL, C.GOAL_H / 2, z); scene.add(m); };
    post(-C.GH); post(C.GH);
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, C.GH * 2, 6), white); bar.rotation.x = Math.PI / 2; bar.position.set(s * C.HL, C.GOAL_H, 0); scene.add(bar);

function serverURL() {

function connect() {

function stepOnline(dt, now) {

  }
  const L = NET.latest; if (!L) return;
  if (NET.predOn && NET.pred) {

/* ================================== SCENE ================================== */
const cam = { x: 0, y: 12, z: 0, tx: 0, tz: 0, init: false };
const _ax = new THREE.Vector3();
function updateScene(dt, now) {
  const vb = view.ball;
  ballMesh.position.set(vb.x, vb.y, vb.z);
  const sp = Math.hypot(vb.vx, vb.vz);
  if (sp > 0.2) { _ax.set(vb.vz, 0, -vb.vx).normalize(); ballMesh.rotateOnWorldAxis(_ax, sp * dt / C.BR); }

  for (let i = 0; i < 6; i++) {
    const o = players[i], p = view.pl[i], spd = Math.hypot(p.vx, p.vz);
    o.root.position.set(p.x, 0, p.z); o.root.rotation.y = -p.a;
    o.shadow.position.set(p.x, 0.02, p.z);
    const lunge = p.fl & 2, stun = p.fl & 4, charge = p.fl & 8;
    o.ph += spd * dt * 1.1;
    const amp = Math.min(1, spd / 6) * 0.95, sw = Math.sin(o.ph);
    o.legL.rotation.z = sw * amp; o.legR.rotation.z = -sw * amp;
    o.armL.rotation.z = -sw * amp * 0.85; o.armR.rotation.z = sw * amp * 0.85;
    if (o.kickT > 0) { o.kickT -= dt; o.legR.rotation.z = 1.5 * Math.sin(Math.min(1, o.kickT / 0.22) * Math.PI); }
    let lean = Math.min(0.26, spd * 0.028) + ((p.fl & 1) ? 0.1 : 0), y = Math.abs(sw) * 0.04 * amp;
    if (charge) lean = -0.22;

      lean = 0.5; y = -0.22; o.legL.rotation.z = 1.25; o.legR.rotation.z = -0.55; o.armL.rotation.z = -0.9; o.armR.rotation.z = 0.9;
    }
    o.inner.rotation.z = -lean; o.inner.position.y = HIP + y;
    o.marker.position.y = 2.4 + Math.sin(now / 220) * 0.12;
  }

    conf.t -= dt; const p = conf.pts.geometry.attributes.position.array, v = conf.vel;

  }
}
function updateCamera(dt, now) {
  if (S.screen !== 'game') {         // menu: slow orbit around the pitch
    const a = now / 9000;
    camera.position.set(Math.cos(a) * 26, 12, Math.sin(a) * 20); camera.lookAt(0, 0, 0); return;

/* ================================== MAIN LOOP ================================== */
let last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 60, lastAdj = 0, shownNet = '';
function frame(nowMs) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0.001, (nowMs - last) / 1000)); last = nowMs;
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 1) {
    fps = fpsN / fpsAcc; fpsAcc = fpsN = 0;
    if (S.quality === 'auto' && nowMs - lastAdj > 3000) {
      if (fps < 42 && pixelRatio > 0.6) { pixelRatio = Math.max(0.6, pixelRatio * 0.85); resize(); lastAdj = nowMs; }
      else if (fps > 57 && pixelRatio < maxPR - 0.05) { pixelRatio = Math.min(maxPR, pixelRatio * 1.1); resize(); lastAdj = nowMs; }
    }
    if (S.screen === 'game') { const t = S.mode === 'online' ? Math.round(NET.rtt) + ' ms · ' + Math.round(fps) + ' fps' : Math.round(fps) + ' fps'; if (t !== shownNet) { shownNet = t; $('net').textContent = t; } }
  }
  if (S.screen === 'game') {
    if (S.mode === 'solo') stepSolo(dt); else if (S.mode === 'online') stepOnline(dt, nowMs);
    updateScene(dt, nowMs); updateHud(nowMs);
  } else {
    for (const o of players) { o.root.position.set(o.id < 3 ? -2 - o.id * 2.5 : 2 + (o.id - 3) * 2.5, 0, (o.id % 3 - 1) * 4); o.root.rotation.y = o.id < 3 ? 0 : Math.PI; o.shadow.position.set(o.root.position.x, 0.02, o.root.position.z); o.marker.visible = false; }
    ballMesh.position.set(0, C.BR, 0); ballBlob.position.set(0, 0.02, 0);
  }
  updateCamera(dt, nowMs);
  renderer.render(scene, camera);
